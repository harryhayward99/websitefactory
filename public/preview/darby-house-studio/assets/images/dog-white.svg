<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 84" fill="none" aria-hidden="true">
  <!-- Sitting Labrador outline facing right — open stroke sketch -->
  <!-- head -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M36 18
       c4.5-3.2 11.5-2.2 14.2 2.8
       c2.2 4-.2 8.5-4.2 10.2
       c-1.6.7-3.4.8-5.1.4"
  />
  <!-- muzzle / nose -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M46.2 28.5c3.2.4 6.4-.2 8.2-2.4c1.2-1.4 1.4-3.4.2-4.8"
  />
  <!-- ear -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M40.5 16.5c2.8-5.2 9.5-6.8 13.2-2.4c2.2 2.6 1.6 6.4-1.2 8.4"
  />
  <!-- eye -->
  <circle cx="43.5" cy="26.5" r="1.45" fill="#fff" />
  <!-- neck into chest / front -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M36.5 30.5
       c-5.5 2.2-9.5 7.2-10.2 13.2
       c-.6 5.2 1.6 10.2 5.8 13.2"
  />
  <!-- back / haunches -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M45.5 31.5
       c5.8 3.5 9.2 10.2 8.2 17
       c-.8 5.5-4.5 10-9.5 12.5"
  />
  <!-- front paw -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M32.2 56.5c-1.2 6.5-.2 13.5 1.5 19.8"
  />
  <!-- sitting haunch down -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M44.2 61c.6 5.8 1.2 11.8 1.5 17.8"
  />
  <!-- belly / seated base -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M26.5 56
       c3.5 10.5 12 17.5 22.5 18.2
       c7 .5 13.2-2.2 17.2-7.2"
  />
  <!-- tail curl -->
  <path
    stroke="#fff"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M54.5 58.5c5.2.8 9.2 4.8 9.2 9.5c0 3.2-1.5 6-4.2 7.5"
  />
  <!-- shoulder heart mark -->
  <path
    stroke="#fff"
    stroke-width="1.65"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M30.5 44.5c1.4-1.5 3.6-1.3 4.5.5c.8 1.4.1 3.1-1.4 3.8"
  />
</svg>
