name: Verify outreach screenshots
on:
  pull_request:
    paths:
      - 'website-factory/capture.mjs'
      - 'public/preview/**'
      - 'package.json'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: |
          for status in public/preview/*/status.json; do
            slug=$(basename "$(dirname "$status")")
            if node -e "process.exit(require('./$status').status==='PREVIEW_READY'?0:1)"; then
              npm run capture -- "$slug"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: outreach-screenshots
          path: |
            public/preview/*/landing.jpg
            public/preview/*/screenshot.json
